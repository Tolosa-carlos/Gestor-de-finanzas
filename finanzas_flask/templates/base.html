<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Finanzas Personales</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a href="/" class="navbar-brand">Finanzas</a>
            <div class="d-flex">
                <a href="/transacciones" class="nav-link text-white">Transacciones</a>
                <a href="/registrar" class="nav-link text-white ms-3">Registrar</a>
                <a href="/categorias" class="nav-link text-white ms-3">Categorías</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for categoria, mensaje in messages %}
                    <div class="alert alert-{{ categoria }} alert-dismissible fade show" role="alert">
                        {{ mensaje }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block contenido %}
        {% endblock %}
    </div>
</body>
</html>
