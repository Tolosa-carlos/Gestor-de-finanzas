{% extends 'base.html' %}

{% block contenido %}

<form method="GET" class="row g-3 mb-4">
    <div class="col-md-3">
        <label class="form-label">Fecha</label>
        <input type="date" name="fecha" class="form-control" value="{{fecha or ''}}">
    </div>
    <div class="col-md-3">
        <label class="form-label">Tipo</label>
        <select name="tipo" class="form-control">
            <option value="">Todos</option>
            <option value="ingreso" {% if tipo == 'ingreso' %} selected {% endif %}>Ingreso</option>
            <option value="gasto"   {% if tipo == 'ingreso' %} selected {% endif %}>Gasto</option>
        </select>
    </div>
    <div class="col-md-3 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">Filtrar</button>
    </div>
</form>
    
<table class="table table-striped table-hover">
    <thead>
        <tr>
            <th>Fecha</th>
            <th>Categoría</th>
            <th>Descripción</th>
            <th>Monto</th>
            <th>Tipo</th>
        </tr>
    </thead>
    <tbody>
        {% for transaccion in transacciones %}
        <tr>
            <td> {{ transaccion[3] }} </td>
            <td> {{ transaccion[2] }} </td>
            <td> {{ transaccion[1] }}</td>
            <td> {{ transaccion[4] }} </td>
            <td> {{ transaccion[5] }} </td>
            <td>
                <form action="/transacciones/eliminar/{{ transaccion[0] }}" method="post">
                    <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                </form>
            </td>
            <td>
               <a href="/transacciones/editar/{{ transaccion[0] }}" class="btn btn-warning btn-sm">Editar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
        
    
{% endblock %}
